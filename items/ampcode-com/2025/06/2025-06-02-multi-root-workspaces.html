<p>Amp now has improved support for multi-root workspaces:</p>
<ul>
<li>Reading, editing, and reverting file changes now works consistently across different workspace roots</li>
<li>The name of the workspace root is now shown alongside file paths in the UI</li>
<li>The search agent now covers all workspace roots</li>
</ul>
