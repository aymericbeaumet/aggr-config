<p>You can now also <a href="/manual#queueing-messages">queue messages</a> in the CLI. Once queued, messages will be sent to the agent once it&#39;s done with its current turn.</p>
<p>Use <code>/queue &lt;message&gt;</code> to enqueue a message and <code>/dequeue</code> to dequeue them.</p>
