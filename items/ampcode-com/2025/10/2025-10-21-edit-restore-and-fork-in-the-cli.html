<p>You can now edit messages in the Amp CLI, restore the thread to a specific point, or fork a new thread from a message.</p>
<p>Hit <code>Tab</code> to select a previous message, then hit <code>e</code> to edit the message, <code>r</code> to restore the thread up to and including that message, or <code>f</code> to fork the thread from that message.</p>
